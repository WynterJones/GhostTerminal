[package]
name = "commandpanel"
version = "0.2.1"
description = "A minimal, always-on-top terminal panel for AI CLIs"
authors = ["Wynter Jones"]
edition = "2021"

[lib]
name = "commandpanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
