<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommandPanel</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body data-mode="full">
    <div id="app">
      <header id="tabbar" data-tauri-drag-region>
        <div id="tabs"></div>
        <button id="newtab" class="icon-btn" title="New tab (⌘T)">+</button>
        <div class="spacer" data-tauri-drag-region></div>
        <div id="actions">
          <button id="cmdbtn" class="icon-btn" title="Quick commands (⌘K)">
            <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M9.5 1 3 9h3.5L6 15l6.5-8H9z"/></svg>
          </button>
          <button id="pinbtn" class="icon-btn" title="Pin (stay open)">
            <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M9.5 1.5 14.5 6.5 13 8l-.5-.5-3 3V13l-1.5 1.5L5.5 12 2 15.5.5 14 4 10.5 1.5 8 3 6.5h2.5l3-3L8 3z"/></svg>
          </button>
          <button id="viewbtn" class="icon-btn" title="Toggle quick / large view">
            <svg viewBox="0 0 16 16" width="13" height="13"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M6 2H2v4M10 14h4v-4"/></svg>
          </button>
          <button id="setbtn" class="icon-btn" title="Settings (⌘,)">
            <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg>
          </button>
        </div>
      </header>
      <main id="terms"></main>
      <div id="palette" hidden>
        <div id="palette-box">
          <div class="palette-head">Quick commands <span class="hint">⌘-click for new tab</span></div>
          <div id="palette-list"></div>
        </div>
      </div>
      <div id="settings" hidden>
        <div id="settings-box">
          <div class="settings-head">
            <span>Settings</span>
            <button id="set-close" class="icon-btn" title="Close (Esc)">×</button>
          </div>
          <div id="settings-body"></div>
        </div>
      </div>
      <div id="drop" hidden><div class="drop-inner">Drop to insert path</div></div>
    </div>
    <div id="mini" hidden>
      <div id="mini-icon">❯</div>
      <div id="mini-dot"></div>
      <div id="mini-count">1</div>
    </div>
  </body>
</html>
